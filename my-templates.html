        :root {

            --white: #ffffff;
            --text: rgba(255,255,255,.9);
            --muted: rgba(255,255,255,.42);
            --dim: rgba(255,255,255,.22);
            --line: rgba(255,255,255,.08);
            --line-soft: rgba(255,255,255,.045);
            --lime: #D1F843;
            --lime-soft: rgba(209,248,67,.08);
            --ease: cubic-bezier(.16,1,.3,1);
            --max: 1240px;

        /* =========================================================

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--black); scroll-behavior: smooth; }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;

        ========================================================= */

            background-size: 12px 12px;
        }
        .dashed-line {

           NAVBAR - مطابق تماماً للاندكس
        ========================================================= */

            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 32px), 1120px);
            z-index: 1000;

            align-items: center;
            justify-content: space-between;

            gap: 4px;

            left: 50%;

            color: rgba(255,255,255,.43);
            font-size: 11px;
            font-weight: 600;

        .nav-links a { transition: color .3s ease; }
        .nav-links a:hover { color: white; }
        .nav-links a.active { color: var(--lime); }

            align-items: center;
            gap: 7px;
        }

            display: inline-flex; align-items: center; justify-content: center; gap: 7px;

            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.58);
            font-size: 10px; font-weight: 800;
            cursor: pointer;
            transition: .35s var(--ease);

        .login-btn {
            height: 42px; padding: 0 15px;

            border: 1px solid var(--line); border-radius: 50px;
            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.58);
            font-size: 10px; font-weight: 800;
            cursor: pointer;
            transition: .35s var(--ease);

           HEADER
        ========================================================= */

           TEMPLATES GRID - نفس استايل البطاقات في الاندكس
        ========================================================= */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .template-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
        }
        .template-card:hover {
            transform: translateY(-6px);
            border-color: rgba(209, 248, 67, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .template-card .preview {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            transition: 0.3s;
        }
        .template-card:hover .preview { border-color: rgba(209, 248, 67, 0.06); }
        .template-card .preview img { width: 100%; height: 100%; object-fit: cover; }
        .template-card .preview i { font-size: 3.5rem; opacity: 0.3; color: var(--lime); }

            background: #22c55e; color: #fff;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;

        .template-card .category {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .template-card .desc {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .template-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            gap: 8px;
            flex-wrap: wrap;
        }
        .template-card .price {
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            font-size: 1.1rem;
        }
        .template-card .price i { color: #22c55e; margin-left: 6px; }

        .template-card .btn-edit {
            background: var(--lime-soft);
            border: 1px solid rgba(209, 248, 67, 0.15);
            color: var(--lime);
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;

            background: var(--lime);
            color: #0a0a0f;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(209, 248, 67, 0.15);

        /* =========================================================
           STATES
        ========================================================= */
        .loading-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 60px;
            grid-column: 1 / -1;
        }
        .loading-state i { font-size: 2.5rem; color: var(--lime); opacity: 0.3; }
        .loading-state p { margin-top: 12px; font-size: 0.9rem; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 4rem; color: rgba(209, 248, 67, 0.05); margin-bottom: 16px; display: block; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: rgba(255, 255, 255, 0.2); margin-bottom: 8px; }

            border-radius: 60px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .empty-state .btn-store:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(209, 248, 67, 0.15); }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .toast {
            padding: 10px 24px;
            border-radius: 12px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideDown 0.3s ease;
            text-align: center;
        }
        .toast.success { border-color: var(--lime); }
        .toast.success i { color: var(--lime); margin-left: 6px; }
        .toast.error { border-color: #ff6b6b; }
        .toast.error i { color: #ff6b6b; margin-left: 6px; }
        .toast.info { border-color: rgba(209, 248, 67, 0.1); }
        .toast.info i { color: rgba(255, 255, 255, 0.3); margin-left: 6px; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

           FOOTER
        ========================================================= */

            .container { padding: 90px 16px 40px; }
            .header h1 { font-size: 1.8rem; }
            .templates-grid { grid-template-columns: 1fr; gap: 16px; }
            .template-card .preview { height: 140px; }

        @media (max-width: 480px) {
            .nav-wrap { width: 96%; }
            .nav { padding: 6px 12px; }
            .logo { font-size: 0.7rem; }
            .logo-img { height: 16px; max-height: 16px; }
            .lang-btn { font-size: 0.55rem; padding: 3px 8px; height: 32px; }
            .start-btn { font-size: 0.55rem; padding: 3px 10px; height: 32px; }
            .header h1 { font-size: 1.4rem; }
            .template-card { padding: 16px; }
            .template-card .preview { height: 120px; }
            .toast-container { top: 70px; width: 90%; }
        }

        @media (max-width: 380px) {
            .logo { font-size: 0.6rem; }
            .logo-img { height: 14px; max-height: 14px; }
        }

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('nolxLang', lang);
            const html = document.documentElement;
            html.lang = lang;
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langText').textContent = lang === 'ar' ? 'EN' : 'AR';

            // تحديث كل العناصر التي تحمل data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // تحديث حالة الفراغ إذا كانت موجودة
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) {
                const h3 = emptyState.querySelector('h3');
                const p = emptyState.querySelector('p');
                const btn = emptyState.querySelector('.btn-store');
                if (h3) h3.textContent = translations[lang].noTemplatesTitle;
                if (p) p.textContent = translations[lang].noTemplatesDesc;
                if (btn) btn.innerHTML = `<i class="fas fa-store"></i> ${translations[lang].goToStore}`;
            }

            // تحديث حالة تسجيل الدخول
            const loginEmpty = document.querySelector('.empty-state .btn-store[href*="login"]');
            if (loginEmpty) {
                loginEmpty.innerHTML = `<i class="fas fa-sign-in-alt"></i> ${translations[lang].loginButton}`;
            }

            // تحديث رسائل الـ Toast يمكن أن تظل ديناميكية
        }

        function toggleLanguage() {
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLanguage(newLang);
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ============================================================
        // UPDATE UI
        // ============================================================
        function updateUI(user) {
            const guestActions = document.getElementById('guestActions');
            const userActions = document.getElementById('userActions');
            const avatar = document.getElementById('userAvatar');

            if (user) {
                const name = user.displayName || user.email?.split('@')[0] || 'User';
                const avatarUrl = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=D1F843&color=0a0a0f`;
                guestActions.style.display = 'none';
                userActions.style.display = 'flex';
                if (avatar) avatar.src = avatarUrl;
            } else {
                guestActions.style.display = 'flex';
                userActions.style.display = 'none';
            }
        }

        // ============================================================
        // LOAD USER PURCHASED TEMPLATES
        // ============================================================
        async function loadUserPurchasedTemplates(uid) {
            try {
                const userRef = db.collection('users').doc(uid);
                const docSnap = await userRef.get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    userPurchasedTemplates = data.purchasedTemplates || [];
                    console.log('📦 القوالب المشتراة:', userPurchasedTemplates);
                } else {
                    userPurchasedTemplates = [];
                }
                return userPurchasedTemplates;
            } catch (error) {
                console.error('[NOLX] Error loading purchased templates:', error);
                userPurchasedTemplates = [];
                return [];
            }
        }

        // ============================================================
        // LOAD TEMPLATES
        // ============================================================
        const TEMPLATE_IDS = [1, 2, 3, 4, 5, 6];
        const ICON_MAP = {
            1: 'fa-crown',
            2: 'fa-store',
            3: 'fa-blog',
            4: 'fa-rocket',
            5: 'fa-palette',
            6: 'fa-tshirt'
        };

        async function loadTemplates() {
            const grid = document.getElementById('templatesGrid');

            grid.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p data-i18n="loadingText">${translations[currentLang].loadingText}</p>
                </div>
            `;

            const loaded = [];
            for (const id of TEMPLATE_IDS) {
                try {
                    const response = await fetch(`templates/template${id}.json`);
                    if (response.ok) {
                        const data = await response.json();
                        data._id = id;
                        data._icon = data.icon || ICON_MAP[id] || 'fa-file-code';
                        loaded.push(data);
                        console.log(`✅ تم تحميل القالب ${id}: ${data.name}`);
                    } else {
                        console.log(`⚠️ القالب ${id} غير موجود (404)`);
                    }
                } catch (e) {
                    console.log(`❌ خطأ في تحميل القالب ${id}:`, e.message);
                }
            }

            allTemplates = loaded;

            if (allTemplates.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3 data-i18n="noTemplatesTitle">${translations[currentLang].noTemplatesTitle}</h3>
                        <p data-i18n="noTemplatesDesc">${translations[currentLang].noTemplatesDesc}</p>
                    </div>
                `;
                return;
            }

            renderOwnedTemplates();
        }

        // ============================================================
        // RENDER OWNED TEMPLATES
        // ============================================================
        function renderOwnedTemplates() {
            const grid = document.getElementById('templatesGrid');

            const owned = allTemplates.filter(t => {
                const id = t.id || t._id;
                return userPurchasedTemplates.includes(String(id));
            });

            if (owned.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-bag"></i>
                        <h3 data-i18n="noTemplatesTitle">${translations[currentLang].noTemplatesTitle}</h3>
                        <p data-i18n="noTemplatesDesc">${translations[currentLang].noTemplatesDesc}</p>
                        <a href="store.html" class="btn-store">
                            <i class="fas fa-store"></i> ${translations[currentLang].goToStore}
                        </a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = owned.map(t => `
                <div class="template-card">
                    <span class="badge-owned">✅ ${translations[currentLang].owned}</span>
                    <div class="preview">
                        ${t.preview_image ? `<img src="${t.preview_image}" alt="${t.name}">` : `<i class="fas ${t._icon || 'fa-file-code'}"></i>`}
                    </div>
                    <div class="category">${t.category || (currentLang === 'ar' ? 'عام' : 'General')}</div>
                    <h3>${t.name || (currentLang === 'ar' ? 'قالب غير مسمى' : 'Untitled Template')}</h3>
                    <p class="desc">${t.description || (currentLang === 'ar' ? 'قالب احترافي جاهز للتعديل' : 'Professional template ready to edit')}</p>
                    <div class="bottom">
                        <span class="price">
                            <i class="fas fa-check-circle"></i> ${translations[currentLang].owned}
                        </span>
                        <button class="btn-edit" onclick="openEditor(${t.id || t._id})">
                            <i class="fas fa-pen"></i> ${translations[currentLang].edit}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // OPEN EDITOR
        // ============================================================
        window.openEditor = function(id) {
            if (!currentUser) {
                showToast(translations[currentLang].toastLoginFirst, 'error');
                setTimeout(() => {
                    window.location.href = `login.html?redirect=editor&id=${id}`;
                }, 1000);
                return;
            }

            if (!userPurchasedTemplates.includes(String(id))) {
                showToast(translations[currentLang].toastNotOwned, 'error');
                return;
            }

            window.location.href = `editor.html?id=${id}`;
        };

        // ============================================================
        // NAV SCROLL
        // ============================================================
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadUserPurchasedTemplates(user.uid);
                updateUI(user);
                console.log('✅ مستخدم مسجل:', user.email);
                await loadTemplates();
            } else {
                currentUser = null;
                userPurchasedTemplates = [];
                updateUI(null);
                console.log('⚠️ لا يوجد مستخدم مسجل');

                const grid = document.getElementById('templatesGrid');
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sign-in-alt"></i>
                        <h3 data-i18n="loginRequired">${translations[currentLang].loginRequired}</h3>
                        <p data-i18n="loginRequiredDesc">${translations[currentLang].loginRequiredDesc}</p>
                        <a href="login.html?redirect=my-templates" class="btn-store">
                            <i class="fas fa-sign-in-alt"></i> ${translations[currentLang].loginButton}
                        </a>
                    </div>
                `;
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        // تطبيق اللغة المحفوظة عند التحميل
        applyLanguage(currentLang);

        console.log('✅ صفحة قوالبك المشتراة جاهزة!');
    </script>
<script src="notify.js"></script>
</body>
</html>
