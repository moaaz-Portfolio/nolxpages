    <style>
        /* =========================================================
           ROOT - نفس ألوان الاندكس
        ========================================================= */
        :root {
            --black: #0a0a0a;
            --surface: #111111;
            --white: #ffffff;
            --text: rgba(255,255,255,.9);
            --muted: rgba(255,255,255,.42);
            --dim: rgba(255,255,255,.22);
            --line: rgba(255,255,255,.08);
            --line-soft: rgba(255,255,255,.045);
            --lime: #D1F843;
            --lime-soft: rgba(209,248,67,.08);
            --ease: cubic-bezier(.16,1,.3,1);
            --max: 1240px;
        }

        /* =========================================================
           RESET
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--black); scroll-behavior: smooth; }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        ::selection { background: var(--lime); color: #0a0a0a; }

        /* =========================================================
           BACKGROUND - نفس خلفية الاندكس (نقاط + خطوط)
        ========================================================= */
        .dot-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 12px 12px;
        }
        .dashed-line {
            background-image: linear-gradient(to bottom, #222222 50%, transparent 50%);
            background-size: 1px 32px;
            background-repeat: repeat-y;
        }

        /* =========================================================
           NAVBAR - مطابق تماماً للاندكس مع تعديل ترتيب اللوجو
        ========================================================= */
        .nav-wrap {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 32px), 1120px);
            z-index: 1000;
        }
        .nav {
            position: relative;
            height: 68px;
            padding: 0 10px 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line);
            border-radius: 100px;
            background: rgba(7,7,7,.62);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 12px 50px rgba(0,0,0,.18);
            transition: .5s var(--ease);
        }
        .nav.scrolled { height: 62px; background: rgba(5,5,5,.92); border-color: rgba(209,248,67,.12); }

        /* LOGO: الصورة شمال (يسار) والكلمة يمين (يمين) */
        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -0.12em;
            white-space: nowrap;
            direction: ltr; /* لمنع انعكاس الترتيب */
        }
        .logo-img { 
            height: 25px; 
            width: auto; 
            object-fit: contain; 
            flex-shrink: 0; 
            max-height: 25px; 
            display: block;
            order: -1; /* الصورة شمال (يسار) */
        }
        .logo span { color: var(--lime); font-weight: 400; }

        .nav-links {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 32px;
            color: rgba(255,255,255,.43);
            font-size: 11px;
            font-weight: 600;
        }
        .nav-links a { transition: color .3s ease; }
        .nav-links a:hover { color: white; }
        .nav-links a.active { color: var(--lime); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .lang-btn, .login-btn {
            height: 42px; padding: 0 15px;
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            border: 1px solid var(--line); border-radius: 50px;
            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.58);
            font-size: 10px; font-weight: 800;
            cursor: pointer;
            transition: .35s var(--ease);
            font-family: inherit;
        }
        .lang-btn:hover, .login-btn:hover { color: var(--lime); border-color: rgba(209,248,67,.25); transform: translateY(-2px); }

        .start-btn {
            height: 42px; padding: 0 19px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50px;
            background: var(--lime);
            color: #050505;
            font-size: 10px; font-weight: 900;
            cursor: pointer;
            transition: .4s var(--ease);
            font-family: inherit;
        }
        .start-btn:hover { box-shadow: 0 12px 40px rgba(209,248,67,.17); }

        .user-actions { display: none; align-items: center; gap: 7px; }
        .nav-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(209,248,67,.15); transition: all .3s ease; }
        .nav-avatar:hover { border-color: #D1F843; transform: scale(1.05); }

        /* =========================================================
           MAIN CONTAINER
        ========================================================= */
        .container {
            position: relative;
            z-index: 1;
            max-width: var(--max);
            margin: 0 auto;
            padding: 110px 24px 60px;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        .header { text-align: center; margin-bottom: 48px; }
        .header .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 15px;
            border: 1px solid var(--line);
            border-radius: 100px;
            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.43);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            margin-bottom: 12px;
        }
        .header .badge i { color: var(--lime); font-size: 7px; filter: drop-shadow(0 0 7px var(--lime)); }
        .header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: -.06em;
        }
        .header h1 span { color: var(--lime); }
        .header p {
            color: rgba(255,255,255,.2);
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 300;
        }

        /* =========================================================
           FILTER BAR
        ========================================================= */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 32px;
        }
        .filter-bar .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: inherit;
        }
        .filter-bar .filter-btn:hover { border-color: rgba(209, 248, 67, 0.2); color: #fff; }
        .filter-bar .filter-btn.active {
            background: var(--lime-soft);
            border-color: rgba(209, 248, 67, 0.15);
            color: var(--lime);
        }

        /* =========================================================
           TEMPLATES GRID - نفس استايل البطاقات في الاندكس
        ========================================================= */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .template-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
        }
        .template-card:hover {
            transform: translateY(-6px);
            border-color: rgba(209, 248, 67, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .template-card .preview {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            transition: 0.3s;
        }
        .template-card:hover .preview { border-color: rgba(209, 248, 67, 0.06); }
        .template-card .preview img { width: 100%; height: 100%; object-fit: cover; }
        .template-card .preview i { font-size: 3.5rem; opacity: 0.3; color: var(--lime); }

        .template-card .badge-popular {
            position: absolute; top: 12px; right: 12px;
            background: var(--lime); color: #0a0a0f;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
        }
        .template-card .badge-new {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 150, 255, 0.12); color: #4dabf7;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
            border: 1px solid rgba(0, 150, 255, 0.08);
        }
        .template-card .badge-owned {
            position: absolute; top: 12px; right: 12px;
            background: #22c55e; color: #fff;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
        }

        .template-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
        .template-card .category {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .template-card .desc {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .template-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            gap: 8px;
            flex-wrap: wrap;
        }
        

        .template-card .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .template-card .btn-edit-free {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .template-card .btn-edit-free:hover {
            background: var(--lime-soft);
            color: var(--lime);
            border-color: rgba(209, 248, 67, 0.15);
            transform: translateY(-2px);
        }

        .template-card .btn-preview {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 8px 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .template-card .btn-preview:hover {
            background: #3b82f6;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }

        /* =========================================================
           STATES
        ========================================================= */
        .loading-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 60px;
            grid-column: 1 / -1;
        }
        .loading-state i { font-size: 2.5rem; color: var(--lime); opacity: 0.3; }
        .loading-state p { margin-top: 12px; font-size: 0.9rem; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 4rem; color: rgba(209, 248, 67, 0.05); margin-bottom: 16px; display: block; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: rgba(255, 255, 255, 0.2); margin-bottom: 8px; }
        .empty-state p { color: rgba(255, 255, 255, 0.1); font-size: 0.9rem; }
        .empty-state .btn-refresh {
            margin-top: 20px;
            background: var(--lime-soft);
            border: 1px solid rgba(209, 248, 67, 0.08);
            color: var(--lime);
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .empty-state .btn-refresh:hover { background: rgba(209, 248, 67, 0.12); }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .toast {
            padding: 10px 24px;
            border-radius: 12px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideDown 0.3s ease;
            text-align: center;
        }
        .toast.success { border-color: var(--lime); }
        .toast.success i { color: var(--lime); margin-right: 6px; }
        .toast.error { border-color: #ff6b6b; }
        .toast.error i { color: #ff6b6b; margin-right: 6px; }
        .toast.info { border-color: rgba(209, 248, 67, 0.1); }
        .toast.info i { color: rgba(255, 255, 255, 0.3); margin-right: 6px; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           FOOTER
        ========================================================= */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.03);
            font-size: 0.7rem;
            max-width: var(--max);
            margin: 0 auto;
        }

        /* =========================================================
           RESPONSIVE - مطابق للاندكس
        ========================================================= */
        @media (max-width: 850px) {
            .nav-wrap { top: 12px; width: calc(100% - 20px); }
            .nav { height: 58px; padding: 0 7px 0 16px; border-radius: 50px; }
            .logo { font-size: 14px; }
            .logo-img { height: 20px; max-height: 20px; }
            .nav-links { display: none; }
            .login-btn { display: none; }
            .lang-btn { height: 38px; padding: 0 11px; font-size: 9px; }
            .start-btn { height: 38px; padding: 0 14px; font-size: 9px; }
            .container { padding: 90px 16px 40px; }
            .header h1 { font-size: 1.8rem; }
            .templates-grid { grid-template-columns: 1fr; gap: 16px; }
            .template-card .preview { height: 140px; }
        }

        @media (max-width: 480px) {
            .nav-wrap { width: 96%; }
            .nav { padding: 6px 12px; }
            .logo { font-size: 0.7rem; }
            .logo-img { height: 16px; max-height: 16px; }
            .lang-btn { font-size: 0.55rem; padding: 3px 8px; height: 32px; }
            .start-btn { font-size: 0.55rem; padding: 3px 10px; height: 32px; }
            .header h1 { font-size: 1.4rem; }
            .filter-bar .filter-btn { font-size: 0.6rem; padding: 4px 12px; }
            .template-card { padding: 16px; }
            .template-card .preview { height: 120px; }
            .template-card .bottom { flex-direction: column; align-items: stretch; }
            .template-card .btn-group { justify-content: center; }
            .toast-container { top: 70px; width: 90%; }
        }

        @media (max-width: 380px) {
            .logo { font-size: 0.6rem; }
            .logo-img { height: 14px; max-height: 14px; }
        }

        /* =========================================================
           LTR
        ========================================================= */
        html[dir="ltr"] body { font-family: 'Inter', 'Cairo', sans-serif; }
    </style>
</head>

    <script>
const grid=document.getElementById('templatesGrid'),filterBar=document.getElementById('filterBar');let allTemplates=[],activeFilter='all';
function make(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){const list=activeFilter==='all'?allTemplates:allTemplates.filter(t=>(t.category||'عام')===activeFilter);grid.replaceChildren();if(!list.length){grid.textContent='لا توجد قوالب مطابقة.';return}list.forEach(t=>{const id=String(t.id||'1'),card=make('article','template-card'),cover=make('div','preview');if(t.preview_image){const img=make('img');img.src=t.preview_image;img.alt='معاينة '+(t.name||'القالب');img.loading='lazy';cover.append(img)}else cover.textContent='NOLX';const cat=make('div','category',t.category||'عام'),title=make('h3','',t.name||'قالب موقع'),desc=make('p','desc',t.description||'قالب مفتوح للتعديل'),bottom=make('div','bottom'),tag=make('span','free-label','متاح مجانًا'),actions=make('div','btn-group'),p=make('button','btn-preview','معاينة'),e=make('button','btn-edit-free','افتح المحرر');p.type=e.type='button';p.onclick=()=>location.href='preview.html?id='+encodeURIComponent(id);e.onclick=()=>location.href='editor.html?id='+encodeURIComponent(id);actions.append(p,e);bottom.append(tag,actions);card.append(cover,cat,title,desc,bottom);grid.append(card)})}
function setFilter(v,b){activeFilter=v;filterBar.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()}
async function init(){try{const cr=await fetch('templates/catalog.json',{cache:'no-store'});if(!cr.ok)throw Error();const c=await cr.json();for(const item of c.templates||[]){const id=String(item.id);if(!/^[a-zA-Z0-9_-]+$/.test(id))continue;const f=item.file||('template'+id+'.json'),res=await fetch('templates/'+f);if(!res.ok)continue;const t=await res.json();t.id=id;allTemplates.push(t)}[...new Set(allTemplates.map(t=>t.category||'عام'))].forEach(v=>{const b=make('button','filter-btn',v);b.type='button';b.onclick=()=>setFilter(v,b);filterBar.append(b)});if(allTemplates.length)render();else grid.textContent='المكتبة فارغة حاليًا.'}catch(e){grid.textContent='تعذر تحميل المكتبة. افتح المشروع عبر خادم محلي أو GitHub Pages.'}}
window.toggleLanguage=()=>{const ar=document.documentElement.lang!=='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';document.getElementById('langText').textContent=ar?'AR':'EN'};init();
</script>
