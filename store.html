        /* =========================================================
           ROOT - نفس ألوان الاندكس
        ========================================================= */
        :root {
            --black: #0a0a0a;
            --surface: #111111;
            --white: #ffffff;
            --text: rgba(255,255,255,.9);
            --muted: rgba(255,255,255,.42);
            --dim: rgba(255,255,255,.22);
            --line: rgba(255,255,255,.08);
            --line-soft: rgba(255,255,255,.045);
            --lime: #D1F843;
            --lime-soft: rgba(209,248,67,.08);
            --ease: cubic-bezier(.16,1,.3,1);
            --max: 1240px;
        }

        /* =========================================================
           RESET
        ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--black); scroll-behavior: smooth; }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; border: 0; cursor: pointer; }
        ::selection { background: var(--lime); color: #0a0a0a; }

        /* =========================================================
           BACKGROUND - نفس خلفية الاندكس (نقاط + خطوط)
        ========================================================= */
        .dot-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 12px 12px;
        }
        .dashed-line {
            background-image: linear-gradient(to bottom, #222222 50%, transparent 50%);
            background-size: 1px 32px;
            background-repeat: repeat-y;
        }

        /* =========================================================
           NAVBAR - مطابق تماماً للاندكس مع تعديل ترتيب اللوجو
        ========================================================= */
        .nav-wrap {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 32px), 1120px);
            z-index: 1000;
        }
        .nav {
            position: relative;
            height: 68px;
            padding: 0 10px 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line);
            border-radius: 100px;
            background: rgba(7,7,7,.62);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: 0 12px 50px rgba(0,0,0,.18);
            transition: .5s var(--ease);
        }
        .nav.scrolled { height: 62px; background: rgba(5,5,5,.92); border-color: rgba(209,248,67,.12); }

        /* LOGO: الصورة شمال (يسار) والكلمة يمين (يمين) */
        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -0.12em;
            white-space: nowrap;
            direction: ltr; /* لمنع انعكاس الترتيب */
        }
        .logo-img { 
            height: 25px; 
            width: auto; 
            object-fit: contain; 
            flex-shrink: 0; 
            max-height: 25px; 
            display: block;
            order: -1; /* الصورة شمال (يسار) */
        }
        .logo span { color: var(--lime); font-weight: 400; }

        .nav-links {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 32px;
            color: rgba(255,255,255,.43);
            font-size: 11px;
            font-weight: 600;
        }
        .nav-links a { transition: color .3s ease; }
        .nav-links a:hover { color: white; }
        .nav-links a.active { color: var(--lime); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .lang-btn, .login-btn {
            height: 42px; padding: 0 15px;
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            border: 1px solid var(--line); border-radius: 50px;
            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.58);
            font-size: 10px; font-weight: 800;
            cursor: pointer;
            transition: .35s var(--ease);
            font-family: inherit;
        }
        .lang-btn:hover, .login-btn:hover { color: var(--lime); border-color: rgba(209,248,67,.25); transform: translateY(-2px); }

        .start-btn {
            height: 42px; padding: 0 19px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50px;
            background: var(--lime);
            color: #050505;
            font-size: 10px; font-weight: 900;
            cursor: pointer;
            transition: .4s var(--ease);
            font-family: inherit;
        }
        .start-btn:hover { box-shadow: 0 12px 40px rgba(209,248,67,.17); }

        .user-actions { display: none; align-items: center; gap: 7px; }
        .nav-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(209,248,67,.15); transition: all .3s ease; }
        .nav-avatar:hover { border-color: #D1F843; transform: scale(1.05); }

        /* =========================================================
           MAIN CONTAINER
        ========================================================= */
        .container {
            position: relative;
            z-index: 1;
            max-width: var(--max);
            margin: 0 auto;
            padding: 110px 24px 60px;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        .header { text-align: center; margin-bottom: 48px; }
        .header .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 15px;
            border: 1px solid var(--line);
            border-radius: 100px;
            background: rgba(255,255,255,.025);
            color: rgba(255,255,255,.43);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            margin-bottom: 12px;
        }
        .header .badge i { color: var(--lime); font-size: 7px; filter: drop-shadow(0 0 7px var(--lime)); }
        .header h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            letter-spacing: -.06em;
        }
        .header h1 span { color: var(--lime); }
        .header p {
            color: rgba(255,255,255,.2);
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 300;
        }

        /* =========================================================
           FILTER BAR
        ========================================================= */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 32px;
        }
        .filter-bar .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.3);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: inherit;
        }
        .filter-bar .filter-btn:hover { border-color: rgba(209, 248, 67, 0.2); color: #fff; }
        .filter-bar .filter-btn.active {
            background: var(--lime-soft);
            border-color: rgba(209, 248, 67, 0.15);
            color: var(--lime);
        }

        /* =========================================================
           TEMPLATES GRID - نفس استايل البطاقات في الاندكس
        ========================================================= */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .template-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
        }
        .template-card:hover {
            transform: translateY(-6px);
            border-color: rgba(209, 248, 67, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .template-card .preview {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            transition: 0.3s;
        }
        .template-card:hover .preview { border-color: rgba(209, 248, 67, 0.06); }
        .template-card .preview img { width: 100%; height: 100%; object-fit: cover; }
        .template-card .preview i { font-size: 3.5rem; opacity: 0.3; color: var(--lime); }

        .template-card .badge-popular {
            position: absolute; top: 12px; right: 12px;
            background: var(--lime); color: #0a0a0f;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
        }
        .template-card .badge-new {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 150, 255, 0.12); color: #4dabf7;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
            border: 1px solid rgba(0, 150, 255, 0.08);
        }
        .template-card .badge-owned {
            position: absolute; top: 12px; right: 12px;
            background: #22c55e; color: #fff;
            font-size: 0.5rem; font-weight: 800;
            padding: 3px 12px; border-radius: 60px;
        }

        .template-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
        .template-card .category {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .template-card .desc {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .template-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            gap: 8px;
            flex-wrap: wrap;
        }
        .template-card .price {
            font-weight: 900;
            color: var(--lime);
            font-size: 1.1rem;
        }
        .template-card .price .original {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.1);
            text-decoration: line-through;
            font-weight: 400;
            margin-left: 6px;
        }
        .template-card .price.owned { color: rgba(255,255,255,0.2); }
        .template-card .price.owned i { color: #22c55e; margin-right: 6px; }

        .template-card .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .template-card .btn-edit-free {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .template-card .btn-edit-free:hover {
            background: var(--lime-soft);
            color: var(--lime);
            border-color: rgba(209, 248, 67, 0.15);
            transform: translateY(-2px);
        }

        .template-card .btn-preview {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 8px 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .template-card .btn-preview:hover {
            background: #3b82f6;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }

        /* =========================================================
           STATES
        ========================================================= */
        .loading-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 60px;
            grid-column: 1 / -1;
        }
        .loading-state i { font-size: 2.5rem; color: var(--lime); opacity: 0.3; }
        .loading-state p { margin-top: 12px; font-size: 0.9rem; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state i { font-size: 4rem; color: rgba(209, 248, 67, 0.05); margin-bottom: 16px; display: block; }
        .empty-state h3 { font-size: 1.3rem; font-weight: 700; color: rgba(255, 255, 255, 0.2); margin-bottom: 8px; }
        .empty-state p { color: rgba(255, 255, 255, 0.1); font-size: 0.9rem; }
        .empty-state .btn-refresh {
            margin-top: 20px;
            background: var(--lime-soft);
            border: 1px solid rgba(209, 248, 67, 0.08);
            color: var(--lime);
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .empty-state .btn-refresh:hover { background: rgba(209, 248, 67, 0.12); }

        /* =========================================================
           TOAST
        ========================================================= */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .toast {
            padding: 10px 24px;
            border-radius: 12px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: slideDown 0.3s ease;
            text-align: center;
        }
        .toast.success { border-color: var(--lime); }
        .toast.success i { color: var(--lime); margin-right: 6px; }
        .toast.error { border-color: #ff6b6b; }
        .toast.error i { color: #ff6b6b; margin-right: 6px; }
        .toast.info { border-color: rgba(209, 248, 67, 0.1); }
        .toast.info i { color: rgba(255, 255, 255, 0.3); margin-right: 6px; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           FOOTER
        ========================================================= */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.03);
            font-size: 0.7rem;
            max-width: var(--max);
            margin: 0 auto;

        /* =========================================================
           RESPONSIVE - مطابق للاندكس
        ========================================================= */
        @media (max-width: 850px) {
            .nav-wrap { top: 12px; width: calc(100% - 20px); }
            .nav { height: 58px; padding: 0 7px 0 16px; border-radius: 50px; }
            .logo { font-size: 14px; }
            .logo-img { height: 20px; max-height: 20px; }
            .nav-links { display: none; }
            .login-btn { display: none; }
            .lang-btn { height: 38px; padding: 0 11px; font-size: 9px; }
            .start-btn { height: 38px; padding: 0 14px; font-size: 9px; }
            .container { padding: 90px 16px 40px; }
            .header h1 { font-size: 1.8rem; }
            .templates-grid { grid-template-columns: 1fr; gap: 16px; }
            .template-card .preview { height: 140px; }
        }

        @media (max-width: 480px) {
            .nav-wrap { width: 96%; }
            .nav { padding: 6px 12px; }
            .logo { font-size: 0.7rem; }
            .logo-img { height: 16px; max-height: 16px; }
            .lang-btn { font-size: 0.55rem; padding: 3px 8px; height: 32px; }
            .start-btn { font-size: 0.55rem; padding: 3px 10px; height: 32px; }
            .header h1 { font-size: 1.4rem; }
            .filter-bar .filter-btn { font-size: 0.6rem; padding: 4px 12px; }
            .template-card { padding: 16px; }
            .template-card .preview { height: 120px; }
            .template-card .bottom { flex-direction: column; align-items: stretch; }
            .template-card .btn-group { justify-content: center; }
            .toast-container { top: 70px; width: 90%; }
        }

        @media (max-width: 380px) {
            .logo { font-size: 0.6rem; }
            .logo-img { height: 14px; max-height: 14px; }
        }

        /* =========================================================
           LTR
        ========================================================= */
        html[dir="ltr"] body { font-family: 'Inter', 'Cairo', sans-serif; }
    </style>

        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userCredits = 0;
        let userPurchasedTemplates = [];
        let allTemplates = [];
        let currentFilter = 'all';
        let currentLang = 'ar';

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ============================================================
        // TRANSLATIONS
        // ============================================================
        const translations = {
            ar: {
                langBtn: 'EN',
                store: 'المتجر',
                templates: 'القوالب',
                subtitle: 'قوالب احترافية جاهزة للتعديل والنشر',
                all: 'الكل',
                business: 'أعمال',
                ecommerce: 'متاجر',
                blog: 'مدونات',
                landing: 'صفحات هبوط',
                general: 'عام',
                loading: 'جاري البحث عن القوالب المتوفرة...',
                emptyTitle: 'لا توجد قوالب في هذا التصنيف',
                emptyDesc: 'جرب تصنيفاً آخر',
                noTemplates: 'لا توجد قوالب متوفرة',
                noTemplatesDesc: 'لم يتم العثور على أي قالب في مجلد templates/',
                retry: 'إعادة المحاولة',
                preview: 'معاينة',
                edit: 'تعديل',
                owned: '✅ مملوك',
                popular: '⭐ الأكثر مبيعاً',
                new: '🆕 جديد',
                purchased: 'تم الشراء',
                login: 'تسجيل الدخول',
                start: 'ابدأ',
                dashboard: 'لوحة التحكم',
                home: 'الرئيسية',
                myTemplates: 'قوالبك',
                support: 'الدعم',
                footer: 'جميع الحقوق محفوظة'
            },
            en: {
                langBtn: 'AR',
                store: 'Store',
                templates: 'Templates',
                subtitle: 'Premium templates ready for editing and publishing',
                all: 'All',
                business: 'Business',
                ecommerce: 'E-Commerce',
                blog: 'Blog',
                landing: 'Landing Pages',
                general: 'General',
                loading: 'Searching for available templates...',
                emptyTitle: 'No templates in this category',
                emptyDesc: 'Try another category',
                noTemplates: 'No templates available',
                noTemplatesDesc: 'No templates found in the templates/ folder',
                retry: 'Retry',
                preview: 'Preview',
                edit: 'Edit',
                owned: '✅ Owned',
                popular: '⭐ Best Seller',
                new: '🆕 New',
                purchased: 'Purchased',
                login: 'Login',
                start: 'Start',
                dashboard: 'Dashboard',
                home: 'Home',
                myTemplates: 'My Templates',
                support: 'Support',
                footer: 'All rights reserved'
            }
        };

        // ============================================================
        // LANGUAGE
        // ============================================================
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langText').textContent = translations[currentLang].langBtn;
            applyTranslations();
            localStorage.setItem('nolxStoreLang', currentLang);
        }

        function applyTranslations() {
            const t = translations[currentLang];
            document.querySelector('.header .badge').innerHTML = `<i class="fa-solid fa-circle"></i> ${t.store}`;
            document.querySelector('.header h1 span').textContent = t.templates;
            document.querySelector('.header p').textContent = t.subtitle;
            document.querySelectorAll('.nav-links a')[0].textContent = t.home;
            document.querySelectorAll('.nav-links a')[1].textContent = t.store;
            document.querySelectorAll('.nav-links a')[2].textContent = t.myTemplates;
            document.querySelectorAll('.nav-links a')[3].textContent = t.support;
            document.getElementById('loginBtn').textContent = t.login;
            document.querySelector('.start-btn').textContent = t.start;
            // تحديث أزرار الفلترة
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const filter = btn.dataset.filter;
                if (filter === 'all') btn.textContent = t.all;
                else if (filter === 'business') btn.textContent = t.business;
                else if (filter === 'ecommerce') btn.textContent = t.ecommerce;
                else if (filter === 'blog') btn.textContent = t.blog;
                else if (filter === 'landing') btn.textContent = t.landing;
                else if (filter === 'general') btn.textContent = t.general;
            });
            document.querySelector('.footer').innerHTML = `© 2026 NOLX PAGES — ${t.footer}`;
            // تحديث البطاقات لو موجودة
            renderTemplates(currentFilter);
        }

        // ============================================================
        // USER DATA
        // ============================================================
        async function loadUserData(uid) {
            try {
                const userRef = db.collection('users').doc(uid);
                const docSnap = await userRef.get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    userCredits = data.credits || 0;
                    userPurchasedTemplates = data.purchasedTemplates || [];
                } else {
                    userCredits = 0;
                    userPurchasedTemplates = [];
                }
                return { credits: userCredits, purchased: userPurchasedTemplates };
            } catch (error) {
                console.error('[NOLX] Error loading user data:', error);
                userCredits = 0;
                userPurchasedTemplates = [];
                return { credits: 0, purchased: [] };
            }
        }

        // ============================================================
        // UPDATE UI
        // ============================================================
        function updateUI(user) {
            const guestActions = document.getElementById('guestActions');
            const userActions = document.getElementById('userActions');
            const avatar = document.getElementById('userAvatar');

            if (user) {
                const name = user.displayName || user.email?.split('@')[0] || 'User';
                const avatarUrl = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=D1F843&color=0a0a0f`;
                guestActions.style.display = 'none';
                userActions.style.display = 'flex';
                if (avatar) avatar.src = avatarUrl;
            } else {
                guestActions.style.display = 'flex';
                userActions.style.display = 'none';
            }
        }

        // ============================================================
        // LOAD TEMPLATES
        // ============================================================
        const TEMPLATE_IDS = [1, 2, 3, 4, 5, 6];
        const CATEGORY_MAP = { 1: 'business', 2: 'ecommerce', 3: 'blog', 4: 'landing', 5: 'business', 6: 'ecommerce' };
        const ICON_MAP = { 1: 'fa-crown', 2: 'fa-store', 3: 'fa-blog', 4: 'fa-rocket', 5: 'fa-palette', 6: 'fa-tshirt' };

        async function loadTemplates() {
            const grid = document.getElementById('templatesGrid');
            grid.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>${translations[currentLang].loading}</p>
                </div>
            `;

            const loaded = [];
            for (const id of TEMPLATE_IDS) {
                try {
                    const response = await fetch(`templates/template${id}.json`);
                    if (response.ok) {
                        const data = await response.json();
                        data._id = id;
                        data._category = data.category || CATEGORY_MAP[id] || 'general';
                        data._icon = data.icon || ICON_MAP[id] || 'fa-file-code';
                        loaded.push(data);
                        console.log(`✅ تم تحميل القالب ${id}: ${data.name}`);
                    } else {
                        console.log(`⚠️ القالب ${id} غير موجود (404)`);
                    }
                } catch (e) {
                    console.log(`❌ خطأ في تحميل القالب ${id}:`, e.message);
                }
            }

            allTemplates = loaded;
            updateFilterButtons();

            if (allTemplates.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>${translations[currentLang].noTemplates}</h3>
                        <p>${translations[currentLang].noTemplatesDesc}</p>
                        <button class="btn-refresh" onclick="loadTemplates()">
                            <i class="fas fa-sync"></i> ${translations[currentLang].retry}
                        </button>
                    </div>
                `;
                return;
            }
            renderTemplates('all');
        }

        // ============================================================
        // FILTER BUTTONS
        // ============================================================
        function updateFilterButtons() {
            const categories = new Set();
            allTemplates.forEach(t => { if (t._category) categories.add(t._category); });

            const bar = document.getElementById('filterBar');
            bar.innerHTML = `<button class="filter-btn active" data-filter="all">${translations[currentLang].all}</button>`;

            const categoryNames = {
                business: translations[currentLang].business,
                ecommerce: translations[currentLang].ecommerce,
                blog: translations[currentLang].blog,
                landing: translations[currentLang].landing,
                general: translations[currentLang].general
            };

            categories.forEach(cat => {
                if (cat !== 'all' && cat !== 'general') {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.filter = cat;
                    btn.textContent = categoryNames[cat] || cat;
                    bar.appendChild(btn);
                }
            });

            bar.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTemplates(currentFilter);
                });
            });
        }

        // ============================================================
        // PREVIEW
        // ============================================================
        function previewTemplate(id) {
            window.open(`preview.html?id=${id}`, '_blank', 'width=1200,height=800,scrollbars=yes,resizable=yes');
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderTemplates(filter = 'all') {
            const grid = document.getElementById('templatesGrid');
            const t = translations[currentLang];

            const filtered = filter === 'all' ?
                allTemplates :
                allTemplates.filter(template => template._category === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>${t.emptyTitle}</h3>
                        <p>${t.emptyDesc}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(template => {
                const templateId = String(template.id || template._id);
                const isOwned = userPurchasedTemplates.includes(templateId);

                return `
                    <div class="template-card">
                        ${template.popular ? `<span class="badge-popular">${t.popular}</span>` : ''}
                        ${template.new && !template.popular ? `<span class="badge-new">${t.new}</span>` : ''}
                        ${isOwned ? `<span class="badge-owned">${t.owned}</span>` : ''}
                        <div class="preview">
                            ${template.preview_image ? `<img src="${template.preview_image}" alt="${template.name}">` : `<i class="fas ${template._icon || 'fa-file-code'}"></i>`}
                        </div>
                        <div class="category">${template._category}</div>
                        <h3>${template.name || 'قالب غير مسمى'}</h3>
                        <p class="desc">${template.description || 'قالب احترافي جاهز للتعديل'}</p>
                        <div class="bottom">
                            <span class="price ${isOwned ? 'owned' : ''}">
                                ${isOwned 
                                    ? `<i class="fas fa-check-circle"></i> ${t.purchased}` 
                                    : `${template.original_price ? `<span class="original">${template.original_price} EGP</span>` : ''} ${template.price || 0} EGP`
                                }
                            </span>
                            <div class="btn-group">
                                <button class="btn-preview" onclick="previewTemplate(${template.id || template._id})" title="${t.preview}">
                                    <i class="fas fa-eye"></i> ${t.preview}
                                </button>
                                <button class="btn-edit-free" onclick="openEditorFree(${template.id || template._id})">
                                    <i class="fas fa-pen"></i> ${t.edit}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // OPEN EDITOR
        // ============================================================
        window.openEditorFree = function(id) {
            window.location.href = `editor.html?id=${id}&mode=free`;
        };

        // ============================================================
        // NAV SCROLL
        // ============================================================
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadUserData(user.uid);
                updateUI(user);
                console.log('✅ مستخدم مسجل:', user.email);
                if (allTemplates.length > 0) {
                    renderTemplates(currentFilter);
                } else {
                    await loadTemplates();
                }
            } else {
                currentUser = null;
                userCredits = 0;
                userPurchasedTemplates = [];
                updateUI(null);
                console.log('⚠️ لا يوجد مستخدم مسجل');
                if (allTemplates.length > 0) {
                    renderTemplates(currentFilter);
                } else {
                    await loadTemplates();
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        const savedLang = localStorage.getItem('nolxStoreLang') || 'ar';
        currentLang = savedLang;
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('langText').textContent = translations[currentLang].langBtn;
        applyTranslations();

        console.log('✅ المتجر جاهز!');
        console.log('💡 التعديل مجاني للجميع');
        console.log('👁️ زر "معاينة" يفتح القالب في نافذة محمية ضد السرقة');
        console.log('💡 الشراء يتم فقط من داخل المحرر');
    </script>
<script src="notify.js"></script>
</body>
</html>
