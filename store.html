<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="مكتبة قوالب مواقع مجانية قابلة للمعاينة والتعديل والتصدير."><title>NOLX Open Lab | مكتبة القوالب</title><link rel="icon" href="log.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{color-scheme:dark;--bg:#090a0f;--panel:#141620;--line:rgba(255,255,255,.08);--muted:#9299a8;--lime:#d1f843;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(167,139,250,.1),transparent 28%),var(--bg);color:#fff;font-family:Cairo,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:rgba(9,10,15,.8);position:sticky;top:0;z-index:5;backdrop-filter:blur(16px)}nav{display:flex;align-items:center;justify-content:space-between;width:100%}.brand{font:800 18px Manrope,sans-serif;letter-spacing:2px}.brand span{color:var(--lime)}.navlinks{display:flex;gap:24px;color:#b0b5c0;font-size:13px}.navlinks a:hover{color:var(--lime)}
main{padding:65px 0 90px}.eyebrow{font-size:11px;color:var(--lime);font-weight:800;letter-spacing:1px}h1{font-size:clamp(34px,5vw,52px);margin:12px 0}.intro{max-width:700px;color:var(--muted);line-height:1.9}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 25px}.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:#fff;font:inherit;outline:none}.search:focus{border-color:var(--lime)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--panel);color:#bfc3cc;padding:9px 13px;border-radius:99px;font:700 11px Cairo;cursor:pointer}.filter.active,.filter:hover{background:rgba(209,248,67,.1);border-color:rgba(209,248,67,.4);color:var(--lime)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:17px}.card{background:linear-gradient(150deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);border-color:rgba(209,248,67,.28)}.cover{height:185px;background:#171923;display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover i{font-size:40px;color:var(--purple)}.content{padding:19px}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.category{font-size:10px;color:var(--purple);letter-spacing:1px}.free{font-size:10px;color:var(--lime);background:rgba(209,248,67,.08);padding:4px 9px;border-radius:99px}h2{font-size:18px;margin:14px 0 7px}.desc{font-size:12px;color:var(--muted);line-height:1.8;min-height:44px}.actions{display:flex;gap:8px;margin-top:18px}.btn{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:11px;font-weight:800}.btn.primary{background:var(--lime);color:#111;border-color:var(--lime)}.btn:hover{border-color:var(--lime)}.state{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:42px 18px;text-align:center;color:var(--muted);line-height:1.9}footer{border-top:1px solid var(--line);padding:22px 0;color:#777;font-size:11px}
@media(max-width:620px){.navlinks{gap:12px;font-size:11px}.navlinks a:nth-child(2){display:none}.tools{align-items:stretch}.search{width:100%}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><nav><a class="brand" href="index.html">NOLX <span>OPEN LAB</span></a><div class="navlinks"><a href="index.html">الرئيسية</a><a href="about.html">عن المشروع</a><a href="editor.html?id=1">المحرر</a></div></nav></div></header>
<main class="wrap"><div class="eyebrow">FREE TEMPLATE LIBRARY</div><h1>مكتبة القوالب</h1><p class="intro">كل القوالب هنا متاحة للمعاينة والتعديل دون حساب أو رصيد أو دفع. اختر قالبًا لتجربته، ثم افتحه في المحرر ونزّل نسخة من عملك.</p>
<div class="tools"><input class="search" id="search" type="search" placeholder="ابحث عن قالب أو تصنيف..." aria-label="ابحث عن قالب"><div class="filters" id="filters"><button class="filter active" data-category="all">الكل</button></div></div>
<section class="grid" id="grid" aria-live="polite"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><br>جاري تحميل القوالب...</div></section></main>
<footer><div class="wrap">NOLX OPEN LAB — مشروع تجريبي مجاني. التعديلات تحفظ محليًا في متصفحك.</div></footer>
<script>
const grid=document.getElementById('grid'),filters=document.getElementById('filters'),search=document.getElementById('search');let templates=[],activeCategory='all';
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function render(){const term=search.value.trim().toLowerCase();const items=templates.filter(t=>(activeCategory==='all'||t.category===activeCategory)&&(`${t.name||''} ${t.description||''} ${t.category||''}`).toLowerCase().includes(term));grid.replaceChildren();if(!items.length){grid.append(node('div','state','لا توجد قوالب مطابقة لبحثك.'));return}
for(const t of items){const id=String(t.id||t._fileId||'1'),card=node('article','card'),cover=node('div','cover');if(t.preview_image){const img=node('img');img.src=t.preview_image;img.alt='معاينة '+(t.name||'القالب');img.loading='lazy';cover.append(img)}else cover.append(node('i','fa-solid fa-window-maximize'));const content=node('div','content'),meta=node('div','meta');meta.append(node('span','category',t.category||'عام'),node('span','free','مجاني'));const title=node('h2','',t.name||'قالب بدون اسم'),desc=node('p','desc',t.description||'قالب جاهز للتعديل والمعاينة'),actions=node('div','actions'),preview=node('a','btn','معاينة'),edit=node('a','btn primary','افتح المحرر');preview.href='preview.html?id='+encodeURIComponent(id);edit.href='editor.html?id='+encodeURIComponent(id);actions.append(preview,edit);content.append(meta,title,desc,actions);card.append(cover,content);grid.append(card)}}
function setCategory(category,button){activeCategory=category;filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));render()}
async function init(){try{const response=await fetch('templates/catalog.json',{cache:'no-store'});if(!response.ok)throw new Error('catalog unavailable');const catalog=await response.json(),entries=Array.isArray(catalog.templates)?catalog.templates:[],loaded=[];for(const item of entries){const id=String(item.id);if(!/^[a-zA-Z0-9_-]+$/.test(id))continue;const file=item.file||('template'+id+'.json'),r=await fetch('templates/'+file);if(!r.ok)continue;const t=await r.json();t._fileId=id;loaded.push(t)}templates=loaded;const categories=[...new Set(templates.map(t=>t.category).filter(Boolean))];for(const category of categories){const b=node('button','filter',category);b.type='button';b.dataset.category=category;b.addEventListener('click',()=>setCategory(category,b));filters.append(b)}if(!templates.length)grid.replaceChildren(node('div','state','لا توجد قوالب في المكتبة حاليًا.'));else render()}catch(error){grid.replaceChildren(node('div','state','تعذر تحميل المكتبة. شغّل المشروع عبر خادم محلي أو GitHub Pages، ولا تفتح الملف مباشرة.'))}}
search.addEventListener('input',render);init();
</script></body></html>
