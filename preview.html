<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
        <link rel="icon" type="image/png" href="log.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة القالب - NOLX PAGES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .preview-header .logo {
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
        }
        .preview-header .logo span { color: #D1F843; }
        .preview-header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .preview-header .actions button {
            padding: 6px 18px;
            border-radius: 60px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
        }
        .btn-close-preview {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.06) !important;
        }
        .btn-close-preview:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .btn-buy-preview {
            background: #D1F843;
            color: #0a0a0f;
        }
        .btn-buy-preview:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(209,248,67,0.15);
        }
        .preview-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            background: #fff;
        }
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
            letter-spacing: 1px;
        }
        .watermark strong {
            color: #D1F843;
            font-weight: 800;
        }
        .loading-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #0a0a0f;
            flex-direction: column;
            gap: 16px;
            color: rgba(255,255,255,0.05);
        }
        .loading-preview i {
            font-size: 3rem;
            color: #D1F843;
            opacity: 0.2;
        }
        .loading-preview p {
            font-size: 0.9rem;
        }
        .security-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            z-index: 999999;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease;
            max-width: 90%;
            text-align: center;
            font-weight: 700;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .preview-header { padding: 8px 12px; }
            .preview-header .logo { font-size: 0.8rem; }
            .preview-header .actions button { font-size: 0.6rem; padding: 4px 12px; }
            .watermark { font-size: 0.5rem; padding: 4px 12px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <div class="logo">NOLX<span>PAGES</span> <span style="font-size:0.6rem;color:rgba(255,255,255,0.1);font-weight:300;">معاينة</span></div>
        <div class="actions">
            <button class="btn-close-preview" onclick="closePreview()">
                <i class="fas fa-times"></i> إغلاق
            </button>
            <button class="btn-buy-preview" onclick="buyTemplate()">
                <i class="fas fa-shopping-cart"></i> شراء القالب
            </button>
        </div>
    </div>

    <iframe id="previewFrame" class="preview-frame" srcdoc=""></iframe>

    <div class="watermark">
        <strong>NOLX PAGES</strong> · معاينة فقط · للشراء تواصل معنا
    </div>

    <script>
        // =========================================================
        // جلب بيانات القالب من URL
        // =========================================================
        const urlParams = new URLSearchParams(window.location.search);
        const templateId = urlParams.get('id') || '1';

        // =========================================================
        // 🛡️ منع CTRL+U وكل طرق السرقة (حتى على Localhost)
        // =========================================================

        // 1. منع CTRL+U وكل الاختصارات (مع capture phase)
        document.addEventListener('keydown', function(e) {
            // CTRL+U
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
            // CTRL+S
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
            // CTRL+C
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
            // CTRL+A
            if (e.ctrlKey && (e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            // CTRL+SHIFT+I
            if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I')) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
            // CTRL+SHIFT+J
            if (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J')) {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
                e.stopPropagation();
                showSecurityAlert();
                return false;
            }
        }, true); // <-- capture phase

        // 2. منع النقر بزر اليمين
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showSecurityAlert();
            return false;
        }, true);

        // 3. منع السحب
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, true);

        // 4. منع النسخ
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showSecurityAlert();
            return false;
        }, true);

        // 5. منع Console
        console.log = function() {};
        console.warn = function() {};
        console.error = function() {};
        console.info = function() {};

        // 6. منع فتح الـ iframe في نافذة جديدة
        const frame = document.getElementById('previewFrame');
        frame.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showSecurityAlert();
            return false;
        });
        frame.addEventListener('mousedown', function(e) {
            if (e.shiftKey) {
                e.preventDefault();
                showSecurityAlert();
                return false;
            }
        });
        frame.addEventListener('click', function(e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                showSecurityAlert();
                return false;
            }
        });
        frame.addEventListener('auxclick', function(e) {
            if (e.button === 1) {
                e.preventDefault();
                showSecurityAlert();
                return false;
            }
        });

        // =========================================================
        // تنبيه السرقة
        // =========================================================
        function showSecurityAlert() {
            if (window._lastAlert && Date.now() - window._lastAlert < 3000) return;
            window._lastAlert = Date.now();
            
            const existing = document.querySelector('.security-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'security-toast';
            toast.innerHTML = `
                <i class="fas fa-shield-alt" style="margin-left: 8px;"></i>
                🔒 معاينة فقط - الكود محمي ضد السرقة
            `;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
        }

        // =========================================================
        // تحميل القالب
        // =========================================================
        async function loadTemplate() {
            const frame = document.getElementById('previewFrame');
            
            frame.srcdoc = `
                <div class="loading-preview">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل القالب...</p>
                </div>
            `;

            try {
                const response = await fetch(`templates/template${templateId}.json`);
                if (!response.ok) throw new Error('قالب غير موجود');
                const template = await response.json();
                
                let html = template.html || '';
                
                // حل محل المتغيرات
                if (template.variables) {
                    Object.keys(template.variables).forEach(key => {
                        const value = template.variables[key] || '';
                        html = html.replace(new RegExp(`{{${key}}}`, 'g'), value);
                    });
                }
                
                // إزالة كود التحرير
                html = html.replace(/<div class="card-delete-btn"[^>]*>[\s\S]*?<\/div>/g, '');
                html = html.replace(/<div class="add-project-card"[^>]*>[\s\S]*?<\/div>/g, '');
                html = html.replace(/ data-index="[^"]*"/g, '');
                html = html.replace(/ onclick="[^"]*"/g, '');
                html = html.replace(/ onmouseover="[^"]*"/g, '');
                html = html.replace(/ onmouseout="[^"]*"/g, '');
                html = html.replace(/window\.parent\.[^"]*"/g, '');
                
                // حماية إضافية داخل الـ iframe
                html = html.replace(/<\/head>/, `
                    <style>
                        * { user-select: none !important; -webkit-user-select: none !important; }
                        body { -webkit-touch-callout: none !important; }
                        img, video { pointer-events: none !important; }
                    </style>
                    <script>
                        document.addEventListener('keydown', function(e) {
                            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'c' || e.key === 'C')) {
                                e.preventDefault();
                                return false;
                            }
                            if (e.key === 'F12') {
                                e.preventDefault();
                                return false;
                            }
                        }, true);
                        document.addEventListener('contextmenu', (e) => e.preventDefault());
                        document.addEventListener('dragstart', (e) => e.preventDefault());
                        document.addEventListener('copy', (e) => e.preventDefault());
                    <\/script>
                <\/head>`);
                
                frame.srcdoc = html;
                
            } catch (error) {
                frame.srcdoc = `
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#0a0a0f;color:rgba(255,255,255,0.1);font-family:'Cairo',sans-serif;flex-direction:column;gap:12px;">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:rgba(255,255,255,0.05);"></i>
                        <p>⚠️ القالب غير متوفر للمعاينة حالياً</p>
                        <button onclick="window.close()" style="margin-top:10px;padding:8px 24px;border-radius:60px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:rgba(255,255,255,0.3);cursor:pointer;font-family:'Cairo',sans-serif;">
                            <i class="fas fa-times"></i> إغلاق
                        </button>
                    </div>
                `;
            }
        }

        function closePreview() {
            window.close();
            window.location.href = 'store.html';
        }

        function buyTemplate() {
            window.location.href = `store.html?buy=${templateId}`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });

        // =========================================================
        // تحميل القالب
        // =========================================================
        loadTemplate();

        console.log('🛡️ الحماية ضد السرقة مفعلة 100% (حتى على Localhost)');
        console.log(`📦 تحميل القالب رقم: ${templateId}`);
    </script>
<script src="notify.js"></script>
</body>
</html>
