<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
        <link rel="icon" type="image/png" href="log.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة القالب - NOLX PAGES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .preview-header .logo {
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
        }
        .preview-header .logo span { color: #D1F843; }
        .preview-header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .preview-header .actions button {
            padding: 6px 18px;
            border-radius: 60px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
        }
        .btn-close-preview {
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.06) !important;
        }
        .btn-close-preview:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .btn-buy-preview {
            background: #D1F843;
            color: #0a0a0f;
        }
        .btn-buy-preview:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(209,248,67,0.15);
        }
        .preview-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            background: #fff;
        }
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
            letter-spacing: 1px;
        }
        .watermark strong {
            color: #D1F843;
            font-weight: 800;
        }
        .loading-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #0a0a0f;
            flex-direction: column;
            gap: 16px;
            color: rgba(255,255,255,0.05);
        }
        .loading-preview i {
            font-size: 3rem;
            color: #D1F843;
            opacity: 0.2;
        }
        .loading-preview p {
            font-size: 0.9rem;
        }
        .security-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            z-index: 999999;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease;
            max-width: 90%;
            text-align: center;
            font-weight: 700;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .preview-header { padding: 8px 12px; }
            .preview-header .logo { font-size: 0.8rem; }
            .preview-header .actions button { font-size: 0.6rem; padding: 4px 12px; }
            .watermark { font-size: 0.5rem; padding: 4px 12px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <div class="logo">NOLX<span>PAGES</span> <span style="font-size:0.6rem;color:rgba(255,255,255,0.1);font-weight:300;">معاينة</span></div>
        <div class="actions">
            <button class="btn-close-preview" onclick="closePreview()">
                <i class="fas fa-times"></i> إغلاق
            </button>
            <button class="btn-buy-preview" onclick="openEditor()"><i class="fas fa-pen"></i> افتح المحرر مجانًا</button>
        </div>
    </div>

    <iframe id="previewFrame" class="preview-frame" srcdoc=""></iframe>

    <div class="watermark">
        <strong>NOLX PAGES</strong> · معاينة مفتوحة · متاح للجميع
    </div>

    <script>
const params=new URLSearchParams(location.search),templateId=params.get('id')||'1',frame=document.getElementById('previewFrame');
function closePreview(){location.href='store.html'}
function openEditor(){location.href='editor.html?id='+encodeURIComponent(templateId)}
async function loadTemplate(){
 try{
  const c=await fetch('templates/catalog.json',{cache:'no-store'});if(!c.ok)throw Error('catalog');const catalog=await c.json();
  const entry=(catalog.templates||[]).find(x=>String(x.id)===String(templateId));if(!entry)throw Error('template');
  const r=await fetch('templates/'+(entry.file||('template'+templateId+'.json')));if(!r.ok)throw Error('template');
  const t=await r.json();let html=String(t.html||'');
  for(const [k,v] of Object.entries(t.variables||{}))html=html.split('{{'+k+'}}').join(String(v??''));
  html=html.replace(/<div class="card-delete-btn"[^>]*>[\s\S]*?<\/div>/g,'').replace(/<div class="add-project-card"[^>]*>[\s\S]*?<\/div>/g,'').replace(/window\.parent\.[^"]*"/g,'');
  frame.removeAttribute('sandbox');frame.srcdoc=html;
 }catch(e){frame.srcdoc='<main style="font-family:sans-serif;padding:40px;text-align:center">تعذر تحميل القالب. ارجع للمكتبة وحاول مرة أخرى.</main>'}
}
loadTemplate();
</script>
</body>
</html>
