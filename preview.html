<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOLX Open Lab | معاينة القالب</title><link rel="icon" href="log.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#090a0f;color:#fff;font-family:Cairo,sans-serif}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;border-bottom:1px solid #292b35;background:#10121a}.brand{font-weight:900;letter-spacing:1px}.brand span{color:#d1f843}.actions{display:flex;gap:8px}.btn{border:1px solid #343744;border-radius:9px;padding:9px 14px;color:#fff;text-decoration:none;font:700 12px Cairo}.btn.primary{background:#d1f843;border-color:#d1f843;color:#101010}.frame{display:block;width:100%;height:calc(100vh - 64px);border:0;background:#fff}.status{position:absolute;inset:64px 0 0;display:grid;place-items:center;color:#9ca3af;pointer-events:none}.frame[hidden]{display:none}.error{color:#ff9b9b;text-align:center;padding:30px;line-height:1.9}@media(max-width:480px){.bar{padding:0 10px}.btn{padding:8px 9px;font-size:10px}}</style></head><body>
<header class="bar"><a class="brand" href="store.html">NOLX <span>OPEN LAB</span></a><div class="actions"><a class="btn" href="store.html">رجوع للمكتبة</a><a class="btn primary" id="editLink" href="editor.html?id=1">افتح في المحرر</a></div></header>
<div class="status" id="status">جاري تحميل المعاينة...</div><iframe class="frame" id="preview" title="معاينة القالب" sandbox="allow-scripts" hidden></iframe>
<script>
(async()=>{const params=new URLSearchParams(location.search),id=params.get('id')||'1',status=document.getElementById('status'),frame=document.getElementById('preview');document.getElementById('editLink').href='editor.html?id='+encodeURIComponent(id);if(!/^[a-zA-Z0-9_-]+$/.test(id)){status.textContent='معرّف القالب غير صالح.';return}try{const catalogResponse=await fetch('templates/catalog.json',{cache:'no-store'});const catalog=catalogResponse.ok?await catalogResponse.json():{templates:[]};const entry=(catalog.templates||[]).find(item=>String(item.id)===id);const file=entry?.file||('template'+id+'.json');const response=await fetch('templates/'+file);if(!response.ok)throw new Error('template not found');const template=await response.json();let html=String(template.html||'');for(const [key,value] of Object.entries(template.variables||{})){html=html.split('{{'+key+'}}').join(String(value??''))}document.title='NOLX Open Lab | '+(template.name||'معاينة');frame.srcdoc=html;frame.hidden=false;status.remove()}catch(error){status.className='error';status.textContent='تعذر تحميل القالب. ارجع إلى مكتبة القوالب وحاول مرة أخرى.'}})();
</script></body></html>
